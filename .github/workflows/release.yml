name: Release

# Publishing an update = change VERSION in iptv_library.py and push to main.
# If there's no release for that version yet, this creates one (tag vX.Y.Z) with the files
# that docker-compose.yml and the app's Update button download.
on:
  push:
    branches: [main]
    paths: ["iptv_library.py", "docker-compose.yml", ".github/workflows/release.yml", "android/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      new: ${{ steps.ver.outputs.new }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the app and read its version
        id: ver
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 -m py_compile iptv_library.py
          V=$(python3 -c "import re;print(re.search(r'^VERSION = \"(.+?)\"', open('iptv_library.py').read(), re.M).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then
            echo "Release v$V already exists - nothing to publish (bump VERSION to release)."
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish release v${{ steps.ver.outputs.version }}
        if: steps.ver.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: |
            iptv_library.py
            docker-compose.yml

  # Android app: bundles the same iptv_library.py with embedded Python (Chaquopy) in a WebView shell
  apk:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Build APK
        run: gradle -p android assembleRelease --stacktrace --no-daemon

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk "IPTV-Library-${{ needs.release.outputs.version }}.apk"

      - name: Keep the APK as a build artifact
        uses: actions/upload-artifact@v4
        with:
          name: IPTV-Library-apk
          path: IPTV-Library-*.apk

      - name: Attach the APK to the release
        if: needs.release.outputs.new == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.release.outputs.version }}
          files: IPTV-Library-*.apk

  # Smoke test: install the APK on an Android emulator and check the app starts and answers
  apk-test:
    needs: apk
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: IPTV-Library-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm

      - name: Run on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install -r -g IPTV-Library-*.apk
            adb shell am start -n com.fudgeamin.iptvlibrary/.MainActivity
            sleep 25
            adb forward tcp:8765 tcp:8765
            echo "== page:"; curl -sf -m 10 http://127.0.0.1:8765/ | grep -o "<title>[^<]*</title>" || echo "PAGE FAILED"
            echo "== version:"; curl -sf -m 10 http://127.0.0.1:8765/api/version || echo "VERSION FAILED"
            echo; echo "== downloads:"; curl -sf -m 10 http://127.0.0.1:8765/api/downloads | head -c 400 || echo "DOWNLOADS FAILED"
            echo; echo "== update check:"; curl -sf -m 30 http://127.0.0.1:8765/api/update/check | head -c 400 || echo "UPDATE FAILED"
            echo; echo "== folders:"; curl -sf -m 10 "http://127.0.0.1:8765/api/folders" | head -c 300 || echo "FOLDERS FAILED"
            echo; echo "== notification/service:"; adb shell dumpsys activity services com.fudgeamin.iptvlibrary | grep -E "ServiceRecord|isForeground" | head -4 || true
            adb exec-out screencap -p > shot-1-start.png
            echo "== download test:"
            curl -sf -XPOST -H 'Content-Type: application/json' http://127.0.0.1:8765/api/downloads/add -d '{"items":[{"url":"https://raw.githubusercontent.com/Fudgeamin99/iptvarr/main/assets/icon.png","title":"CI test","kind":"movie","path":["CI test","ci-test.png"]}]}' || echo "ADD FAILED"
            sleep 10
            curl -sf -m 10 http://127.0.0.1:8765/api/downloads | grep -o '"jobs": \[.*' | head -c 500; echo
            adb shell 'ls -l "/storage/emulated/0/Download/IPTV Library/Movies/CI test/"' || echo "FILE NOT FOUND"
            adb shell input keyevent KEYCODE_BACK; sleep 2
            echo "== still running after Back: $(curl -sf -m 5 http://127.0.0.1:8765/api/version || echo NO)"
            adb shell am start -n com.fudgeamin.iptvlibrary/.MainActivity; sleep 4
            adb shell wm size 1080x2400; adb exec-out screencap -p > shot-2-again.png
            echo "== app log:"; adb logcat -d -s IPTVLibrary:* python.stdout:* python.stderr:* AndroidRuntime:E | tail -40
            curl -sf -m 10 http://127.0.0.1:8765/api/version > /dev/null

      - name: Save screenshots to the ci-shots branch
        if: always()
        run: |
          ls shot-*.png || exit 0
          mkdir shots && cp shot-*.png shots/ && cd shots
          git init -q -b ci-shots && git add . && git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "APK screenshots ${{ github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-shots

